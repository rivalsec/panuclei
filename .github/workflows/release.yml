name: release

# Build release binaries on tag push and attach them to a GitHub Release.
# Asset naming mirrors the projectdiscovery convention AutoBB already consumes:
#   panuclei_<version>_<os>_<arch>.tar.gz   (binary at archive root)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w" -o panuclei .
          tar -czf "panuclei_${ver}_${GOOS}_${GOARCH}.tar.gz" panuclei
      - uses: softprops/action-gh-release@v2
        with:
          files: panuclei_*.tar.gz
